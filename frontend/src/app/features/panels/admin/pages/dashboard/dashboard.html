<header class="page-head">
  <div>
    <h1 class="page-head__title">{{ saludo }}{{ usuario() ? ', ' + usuario()!.nombre : '' }}</h1>
    <p class="page-head__sub">
      Usuarios, roles y permisos, y la salud de las APIs y el uso de la plataforma.
      @if (corte(); as c) {
        <span class="admin-corte">· Actualizado {{ c | date: 'HH:mm' }}</span>
      }
    </p>
  </div>

  <button type="button" class="ui-btn ui-btn--secondary" (click)="cargar()" [disabled]="cargando()">
    <ui-icon name="refresh" [size]="16" />
    Actualizar
  </button>
</header>

@if (error() && !datos()) {
  <div class="table-card">
    <ui-empty icono="alerta" titulo="No se pudieron cargar los accesos" [mensaje]="error()!">
      <button type="button" class="ui-btn ui-btn--secondary ui-btn--sm" (click)="cargar()">
        <ui-icon name="refresh" [size]="16" /> Reintentar
      </button>
    </ui-empty>
  </div>
} @else {
  <app-resumen-accesos [datos]="datos()" [cargando]="cargando()" />
}

<app-tablero-operacion [cuentasActivas]="kpis()?.usuariosActivos ?? null" />
